name: Security regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/beeboard/BeeBoard_Interface/requirements.txt pytest httpx
      - run: python -m pytest tests/security/test_local_api.py
      - run: |
          python tests/security/build_parser_test.py
          g++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie parser_security_test.cpp -o parser_security_test
          ./parser_security_test parser-canary.bin
